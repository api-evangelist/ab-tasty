apis:
- aid: ab-tasty:ab-tasty-remote-control-api
  name: AB Tasty Remote Control API
  humanURL: https://docs.abtasty.com/server-side/remote-control-api
  properties:
  - url: https://docs.abtasty.com/server-side/remote-control-api
    type: Documentation
  tags:
  - Remote Control
  - Campaigns
  - Experimentation
  description: >-
    AB Tastys Remote Control API is a developer and QA tool that lets you programmatically drive the AB
    Tasty SDK from outside your app or page, so you can precisely control and observe experiments without
    changing production targeting. With it, you can preview or force specific campaigns and variations
    for a visitor, toggle or pause experiences, set visitor/context attributes, trigger goals and custom
    events, refresh decisions, and clear caches to reproduce clean states.
- aid: ab-tasty:ab-tasty-public-api
