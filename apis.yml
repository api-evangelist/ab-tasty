    type: Documentation
  tags:
  - Campaigns
  - Integration
  - Management
  tags_raw:
  - Campaigns
  - Integrations
  - Management
  description: >-
    The AB Tasty Public API provides programmatic access to manage campaigns, monitor and control experiments,
    manage account users, and integrate AB Tasty with third-party tools. It uses OAuth-style credentials
    (ClientID and ClientSecret) to generate access tokens for authentication.
